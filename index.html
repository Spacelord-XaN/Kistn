<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxGen</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>BoxGen</h1>
        <button id="version" class="version" title="Release notes"></button>
      </div>
      <div class="actions">
        <button id="open">Open XML…</button>
        <button id="save">Save XML</button>
        <button id="example">Load example</button>
        <button id="export" class="primary">Export SVG</button>
        <input id="file" type="file" accept=".xml,text/xml" hidden />
      </div>
    </header>
    <main>
      <section class="editor-pane">
        <div id="editor"></div>
        <div id="errors" role="status"></div>
      </section>
      <section class="preview-pane">
        <div id="preview"></div>
        <div id="summary"></div>
        <div class="view-options">
          <label class="view-option"><input id="inside-dims" type="checkbox" /> Inside dimensions</label>
          <label class="view-option"><input id="show-volume" type="checkbox" /> Volume</label>
        </div>
      </section>
    </main>
    <dialog id="notes">
      <form method="dialog" class="notes-close"><button aria-label="Close">×</button></form>
      <div id="notes-body"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
